# Use cfchase fork and dev-nightly branch
- op: replace
  path: /spec/generators/0/git/repoURL
  value: https://github.com/cfchase/rhoaibu-cluster
- op: replace
  path: /spec/generators/0/git/revision
  value: dev-nightly
- op: replace
  path: /spec/template/spec/source/repoURL
  value: https://github.com/cfchase/rhoaibu-cluster
- op: replace
  path: /spec/template/spec/source/targetRevision
  value: dev-nightly

# Disable auto-sync: ApplicationSet only creates apps, doesn't update them
- op: add
  path: /spec/syncPolicy
  value:
    applicationsSync: create-only
# Apps created with empty syncPolicy (no auto-sync)
- op: replace
  path: /spec/template/spec/syncPolicy
  value: {}

# Exclude rhoai-operator from git generator (will add via list generator with nightly overlay)
- op: add
  path: /spec/generators/0/git/directories/-
  value:
    path: components/operators/rhoai-operator
    exclude: true

# Add rhoai-operator via list generator pointing to nightly overlay
# Note: path.basename is used for app name, so we set it explicitly for list generators
- op: add
  path: /spec/generators/-
  value:
    list:
      elements:
        - cluster: local
          path: components/operators/rhoai-operator/overlays/nightly
          path.basename: rhoai-operator

# Add nightly-only operators via list generator
- op: add
  path: /spec/generators/-
  value:
    list:
      elements:
        - cluster: local
          path: components/operators-nightly/kueue-operator
          path.basename: kueue-operator
        - cluster: local
          path: components/operators-nightly/jobset-operator
          path.basename: jobset-operator
        - cluster: local
          path: components/operators-nightly/leader-worker-set
          path.basename: leader-worker-set
        - cluster: local
          path: components/operators-nightly/connectivity-link
          path.basename: connectivity-link
